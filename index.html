<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b140f">
<title>Tiệm Xôi Bến Dừa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Giao diện toàn màn hình 16:9. Mọi cỡ chữ/nút tính theo --u (1% chiều rộng khung game) */
:root{--ink:#2a1a10;--paper:#f6ecd2;--paper2:#e9d8ad;--leaf:#4f9a45;--leafd:#2f6a2e;--clay:#c8462e;--gold:#f2b632}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b140f;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
body{display:grid;place-items:center}
#game{--u:calc(min(100vw,100vh*16/9)/100);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);font-size:calc(var(--u)*1.9)}
@supports(height:100dvh){#game{--u:calc(min(100vw,100dvh*16/9)/100)}}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
.ic{width:calc(var(--u)*3);height:calc(var(--u)*3);image-rendering:pixelated;vertical-align:middle;flex:none}
[data-ic]{display:inline-flex}
#hud{position:absolute;top:calc(var(--u)*1);left:calc(var(--u)*1);display:flex;gap:calc(var(--u)*.8);pointer-events:none;align-items:center}
#hud .chip{background:transparent!important;border:none!important;box-shadow:none!important;padding:0;font-size:calc(var(--u)*1.8);font-weight:700;text-shadow:0 1px 2px #000c,0 0 3px #0008;color:#fffaf0;gap:calc(var(--u)*.3)}
#bagbtn{
  position:static;flex:0 0 auto;pointer-events:auto;
  width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);
  min-width:calc(var(--u)*6.4);padding:0;margin:0;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box
}
#bagbtn .ic{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2)}
.chip{display:flex;align-items:center;gap:calc(var(--u)*.6);background:var(--paper);border:2px solid var(--ink);box-shadow:0 2px 0 #000a;padding:calc(var(--u)*.4) calc(var(--u)*1);font:600 calc(var(--u)*1.9) "Be Vietnam Pro",sans-serif;color:var(--ink);cursor:pointer;position:relative}
.chip.sel,.nb.on{background:var(--gold)}
.bd{position:absolute;top:calc(var(--u)*-1);right:calc(var(--u)*-.8);background:var(--clay);color:#fff;border:2px solid var(--ink);border-radius:99px;min-width:calc(var(--u)*2.6);text-align:center;font-size:calc(var(--u)*1.5);padding:0 4px}
.bd:empty{display:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;padding:calc(var(--u)*1);background:linear-gradient(transparent,#0008);pointer-events:none}
#tool{display:flex;gap:calc(var(--u)*.4);pointer-events:auto;justify-content:center;align-items:center}
#tool .chip{
  position:relative;
  width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);
  min-width:calc(var(--u)*6.4);max-width:calc(var(--u)*6.4);
  padding:calc(var(--u)*.15);margin:0;box-sizing:border-box;
  font-size:calc(var(--u)*1.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 auto;white-space:nowrap
}
#tool .chip .ic{width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);flex:none}
#tool .chip .slotn{position:absolute;top:1px;left:3px;font-size:calc(var(--u)*1.05);opacity:.7;font-weight:700;line-height:1}
#tool .chip .qty{font-size:calc(var(--u)*1.15);line-height:1;font-weight:700}
#tool .chip.empty{opacity:.45;background:var(--paper2)}
#tool .chip.sel{
  background:#1a1208;color:#c9a86a;opacity:1;
  border-color:#f2b632;
  box-shadow:inset 0 0 0 2px #f2b632,0 0 0 2px #2a1a10,0 3px 0 #000a
}
#tool .chip.sel .ic{opacity:.5;filter:brightness(.5)}
#tool .chip.sel .qty{opacity:.45}
#tool .chip.sel .slotn{opacity:1;color:#f2b632;font-weight:800}
#nav{display:none}
#toast{position:absolute;top:calc(var(--u)*5.5);left:50%;transform:translateX(-50%);max-width:70%;background:#2a1a10e0;color:var(--gold);padding:calc(var(--u)*.5) calc(var(--u)*1.5);font-weight:600;text-align:center}
#toast:empty{display:none}
#modal{display:none;position:absolute;inset:calc(var(--u)*3) calc(var(--u)*14);background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 #000a;flex-direction:column;z-index:5}
#mh{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*.8) calc(var(--u)*1.5);border-bottom:3px solid var(--ink);background:var(--paper2);font-weight:800;font-size:calc(var(--u)*2.4)}
#mbody{padding:calc(var(--u)*1.2) calc(var(--u)*1.5);overflow:auto;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1);padding:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.8);background:#fffaf0;border:2px solid var(--ink)}
.row .name{display:flex;align-items:center;gap:calc(var(--u)*.8);flex:1;min-width:0}
.row small,.hint{display:block;font-size:calc(var(--u)*1.5);color:#7a5a40;font-weight:400}
.ing{display:flex;gap:calc(var(--u)*1);margin-top:2px;font-size:calc(var(--u)*1.5)}
.ing span{display:inline-flex;align-items:center}.ing .ic{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
.lack{color:var(--clay);font-weight:600}
h3{margin:calc(var(--u)*1.2) 0 calc(var(--u)*.8);color:var(--leafd);font-size:calc(var(--u)*2.1)}
.btn{font:600 calc(var(--u)*1.8) "Be Vietnam Pro",sans-serif;color:#fff;background:var(--leaf);border:2px solid var(--ink);box-shadow:0 3px 0 var(--leafd);padding:calc(var(--u)*.5) calc(var(--u)*1.2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*.5)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #b8841c}
.btn.red{background:var(--clay);box-shadow:0 3px 0 #8a2d1c}
.btn .ic{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4)}
.bar{height:calc(var(--u)*1.2);flex:1;min-width:calc(var(--u)*6);background:var(--paper2);border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--leaf) 0 6px,#6dbd5e 6px 8px)}
.bar.warn i{background:var(--clay)}
b.n{font-weight:800}.empty{color:#7a5a40}
#rot{display:none;position:fixed;bottom:16px;left:0;right:0;text-align:center;color:var(--gold);font-weight:600}
@media(orientation:portrait){#rot{display:block}}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b140f;color:var(--gold);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px;line-height:1.6}
@media(orientation:portrait){#rot{display:flex}}

</style></head>
<body>
<div id="game">
 <canvas id="cv" width="384" height="216"></canvas>
 <div id="hud"></div>
 <div id="toast"></div>
 <div id="bar">
  <div id="tool"></div>
  <button class="chip" id="bagbtn" data-modal="bag" title="Túi đồ"><i data-ic="balo"></i></button>
 </div>
 <div id="modal"><div id="mh"><span id="mtitle"></span><button class="btn" data-modal="">Đóng</button></div><div id="mbody"></div></div>
</div>
<div id="rot">Game chỉ chơi ở chế độ ngang.<br>Hãy xoay ngang điện thoại nhé.</div>

<script src="js/core.js"></script>
<script src="js/zones/farm.js"></script>
<script src="js/zones/market.js"></script>
<script src="js/zones/kitchen.js"></script>
<script src="js/zones/shop.js"></script>
<script src="js/zones/hub.js"></script>
<script src="js/zones/pets.js"></script>
<script src="js/ui.js"></script>

</body></html>
